<!-- Source for og.png: render at 1200x630. Not linked from the site. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Same tokens as styles.css: flat brand mark, no gradient, no shadow. */
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; color: #09090b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    background: #ffffff;
  }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .mark { width: 124px; height: 124px; border-radius: 37px; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 59px; letter-spacing: -.06em; line-height: 1;
    background: #cc0033; }
  .mark span { transform: translateY(-.03em); }
  .word { font-size: 104px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .tag { font-size: 38px; font-weight: 500; color: #71717a; }
</style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <div class="mark"><span>sp</span></div>
      <div class="word">spawnpoint</div>
    </div>
    <div class="tag">The easiest way to bring your software online.</div>
  </div>
</body>
</html>

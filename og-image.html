<!-- Source for og.png: render at 1200x630. Not linked from the site. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* The app's identity, as the site's pages wear it: dark, the wordmark,
     Geist for the line under it. */
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
    background: #000000;
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
  }
  .card img { width: 620px; height: auto; display: block; }
  .tag { font-size: 38px; font-weight: 400; letter-spacing: -.01em; color: #a3a3a3; }
  .tag b { color: #ef285e; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <img src="brand/wordmark.svg" alt="spawnpoint" />
    <div class="tag">The <b>easiest</b> way to bring your software online.</div>
  </div>
</body>
</html>

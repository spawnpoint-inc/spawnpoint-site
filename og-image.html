<!-- Source for og.png — render at 1200x630. Not linked from the site. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    font-family: "DM Sans", system-ui, sans-serif; color: #221d18;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 45px, rgba(120,92,58,.05) 45px, rgba(120,92,58,.05) 46px),
      linear-gradient(180deg, #f7f4ee, #efe9df);
    position: relative;
  }
  .eyebrow { position: absolute; top: 66px; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #cc0033; }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .mark { width: 132px; height: 132px; border-radius: 36px; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 64px; letter-spacing: -.06em; line-height: 1;
    background-image: linear-gradient(180deg, #e0335a, #cc0033 55%, #a4002a);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 6px 18px rgba(164,0,42,.3); }
  .mark span { transform: translateY(-.03em); }
  .word { font-size: 108px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .tag { font-size: 34px; font-weight: 500; color: #6b625a; }
  .foot { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center;
    font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: .1em; color: #a4002a; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">The easiest way to bring your software online</div>
    <div class="lockup">
      <div class="mark"><span>sp</span></div>
      <div class="word">spawnpoint</div>
    </div>
    <div class="tag">Spawn your software into the world.</div>
    <div class="foot">spin up · tear down</div>
  </div>
</body>
</html>

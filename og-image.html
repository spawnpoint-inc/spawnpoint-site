<!-- Source for og.png: render at 1200x630. Not linked from the site. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    font-family: "DM Sans", system-ui, sans-serif; color: #1a1d21;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 45px, rgba(120,92,58,.05) 45px, rgba(120,92,58,.05) 46px),
      linear-gradient(180deg, #ffffff, #f4f5f7);
    position: relative;
  }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .mark { width: 132px; height: 132px; border-radius: 36px; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 64px; letter-spacing: -.06em; line-height: 1;
    background-image: linear-gradient(180deg, #e0335a, #cc0033 55%, #a4002a);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 6px 18px rgba(164,0,42,.3); }
  .mark span { transform: translateY(-.03em); }
  .word { font-size: 108px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .tag { font-size: 40px; font-weight: 500; color: #555c64; }
</style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <div class="mark"><span>sp</span></div>
      <div class="word">spawnpoint</div>
    </div>
    <div class="tag">The easiest way to bring your software online.</div>
  </div>
</body>
</html>
